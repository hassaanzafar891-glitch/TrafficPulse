{
  "name": "Synthetic checks",
  "on": [
    "push",
    "pull_request"
  ],
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "synthetic-ci-${{ github.workflow }}-${{ github.ref }}",
    "cancel-in-progress": true
  },
  "env": {
    "OMP_NUM_THREADS": "4",
    "OPENBLAS_NUM_THREADS": "4",
    "MKL_NUM_THREADS": "4",
    "NUMEXPR_NUM_THREADS": "4",
    "NUMEXPR_MAX_THREADS": "4",
    "UV_THREADPOOL_SIZE": "4",
    "GOMAXPROCS": "4",
    "RAYON_NUM_THREADS": "4",
    "DO_NOT_TRACK": "true",
    "MLFLOW_ENABLE_TELEMETRY": "false",
    "PYTHONHASHSEED": "0",
    "PYTHONPATH": "src",
    "VITE_API_BASE_URL": ""
  },
  "jobs": {
    "checks": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 30,
      "steps": [
        {
          "name": "Checkout (v7.0.1; upstream SHA verified)",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false,
            "fetch-depth": 1,
            "lfs": false,
            "submodules": false
          }
        },
        {
          "name": "Python 3.12",
          "uses": "actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0",
          "with": {
            "python-version": "3.12.10"
          }
        },
        {
          "name": "Node 22",
          "uses": "actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1",
          "with": {
            "node-version": "22.18.0"
          }
        },
        {
          "name": "Install pinned Python test dependencies",
          "run": "python -m pip install --disable-pip-version-check --only-binary=:all: -r configs/ci-requirements.txt"
        },
        {
          "name": "Validate installed dependencies",
          "run": "python -m pip check"
        },
        {
          "name": "Validate workflow offline",
          "run": "python scripts/validate_ci.py"
        },
        {
          "name": "Run guarded artifact-free backend tests",
          "run": "python scripts/run_ci_checks.py"
        },
        {
          "name": "Install locked frontend dependencies",
          "run": "npm ci --ignore-scripts --no-audit --no-fund",
          "working-directory": "frontend"
        },
        {
          "name": "Run frontend tests",
          "run": "npm test",
          "working-directory": "frontend"
        },
        {
          "name": "Build frontend",
          "run": "npm run build",
          "working-directory": "frontend"
        }
      ]
    }
  }
}
